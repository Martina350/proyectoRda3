<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reserva confirmada con éxito en Pet CareConnect.">
    <title>Reserva Confirmada - Pet CareConnect</title>
    <link rel="icon" href="../assets/images/paw.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/toast.js" defer></script>
    <script src="../js/layout.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/bookings.js" defer></script>
    <script src="../js/ui.js" defer></script>
    <script src="../js/confirmacionModal.js" defer></script>
    <script src="../js/reservaConfirmada.js" defer></script>
</head>
<body>

    <div id="site-header"></div>

    <main class="container confirmation-page-container">
        <section class="card-surface card-padding confirmation-fallback-card" aria-labelledby="confirm-page-title">
            <div class="confirmation-icon-circle">
                <span class="material-symbols-outlined">event_available</span>
            </div>
            <div class="confirmation-heading">
                <h1 id="confirm-page-title" class="bookings-title">Confirmación de reserva</h1>
                <p class="bookings-subtitle">Si acabas de reservar, el resumen aparece en el modal. También puedes revisar tu historial.</p>
            </div>
            <div class="confirmation-actions">
                <a href="misReservas.html" class="button button-primary">Ver Mis Reservas</a>
                <a href="nuevaReserva.html" class="button button-outline">Nueva Reserva</a>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>
    <div id="site-mobile-nav"></div>

</body>
</html>
