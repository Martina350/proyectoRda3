<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestiona tus citas de cuidado, paseos y reservas para tus mascotas en Pet CareConnect.">
    <title>Mis Reservas - Pet CareConnect</title>
    <link rel="icon" href="../assets/images/paw.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/toast.js" defer></script>
    <script src="../js/layout.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/bookings.js" defer></script>
    <script src="../js/misReservas.js" defer></script>
</head>
<body>

    <div id="site-header"></div>

    <main class="container bookings-main">

        <header class="bookings-header-section">
            <div class="bookings-header-content">
                <div>
                    <h1 id="page-title" class="bookings-title">Mis Reservas</h1>
                    <p class="bookings-subtitle">Gestiona tus citas de cuidado, paseos y estancias para tus mascotas.</p>
                </div>
            </div>
        </header>

        <nav class="bookings-tabs-nav" role="tablist" aria-label="Filtrar reservas por estado">
            <button type="button"
                    class="bookings-tab-btn active"
                    role="tab"
                    id="tab-activas"
                    data-tab="activas"
                    aria-selected="true"
                    aria-controls="panel-activas">
                Activas
                <span id="badge-count-activas" class="badge-count badge-activas">0</span>
            </button>
            <button type="button"
                    class="bookings-tab-btn"
                    role="tab"
                    id="tab-pasadas"
                    data-tab="pasadas"
                    aria-selected="false"
                    aria-controls="panel-pasadas"
                    tabindex="-1">
                Pasadas
                <span id="badge-count-pasadas" class="badge-count badge-pasadas">0</span>
            </button>
            <button type="button"
                    class="bookings-tab-btn"
                    role="tab"
                    id="tab-canceladas"
                    data-tab="canceladas"
                    aria-selected="false"
                    aria-controls="panel-canceladas"
                    tabindex="-1">
                Canceladas
                <span id="badge-count-canceladas" class="badge-count badge-canceladas">0</span>
            </button>
        </nav>

        <div class="bookings-tab-panels">
            <section id="panel-activas"
                     class="bookings-tab-panel active"
                     role="tabpanel"
                     aria-labelledby="tab-activas"
                     data-panel="activas">
                <div id="activas-cards-container" class="bookings-cards-grid"></div>
            </section>

            <section id="panel-pasadas"
                     class="bookings-tab-panel"
                     role="tabpanel"
                     aria-labelledby="tab-pasadas"
                     data-panel="pasadas"
                     hidden>
                <div id="pasadas-cards-container" class="bookings-cards-grid"></div>
            </section>

            <section id="panel-canceladas"
                     class="bookings-tab-panel"
                     role="tabpanel"
                     aria-labelledby="tab-canceladas"
                     data-panel="canceladas"
                     hidden>
                <div id="canceladas-cards-container" class="bookings-cards-grid"></div>
            </section>
        </div>

    </main>

    <div id="site-footer"></div>

    <div id="site-mobile-nav"></div>

</body>
</html>
