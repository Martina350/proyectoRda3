<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestiona tus citas de cuidado, paseos y reservas para tus mascotas en Pet CareConnect.">
    <title>Mis Reservas - Pet CareConnect</title>
    <link rel="icon" href="../assets/images/paw.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/toast.js" defer></script>
    <script src="../js/layout.js" defer></script>
    <script src="../js/auth.js" defer></script>
    <script src="../js/bookings.js" defer></script>
    <script src="../js/misReservas.js" defer></script>
</head>
<body>

    <div id="site-header"></div>

    <main class="container bookings-main">

        <section aria-labelledby="page-title" class="bookings-header-section">
            <div class="bookings-header-content">
                <div>
                    <h1 id="page-title" class="bookings-title">Mis Reservas</h1>
                    <p class="bookings-subtitle">Gestiona tus citas de cuidado, paseos y estancias para tus mascotas.</p>
                </div>
            </div>
        </section>

        <div class="bookings-columns-grid">

            <!-- Columna 1: Activas -->
            <section aria-labelledby="activas-title" class="bookings-column">
                <div class="column-header">
                    <h2 id="activas-title" class="column-title">
                        Activas <span id="badge-count-activas" class="badge-count badge-activas">0</span>
                    </h2>
                </div>

                <div id="activas-cards-container" class="column-cards">
                    <!-- Inyectado dinámicamente por js/misReservas.js -->
                </div>
            </section>

            <!-- Columna 2: Pasadas -->
            <section aria-labelledby="pasadas-title" class="bookings-column">
                <div class="column-header">
                    <h2 id="pasadas-title" class="column-title">
                        Pasadas <span id="badge-count-pasadas" class="badge-count badge-pasadas">0</span>
                    </h2>
                </div>

                <div id="pasadas-cards-container" class="column-cards">
                    <!-- Inyectado dinámicamente por js/misReservas.js -->
                </div>
            </section>

            <!-- Columna 3: Canceladas -->
            <section aria-labelledby="canceladas-title" class="bookings-column">
                <div class="column-header">
                    <h2 id="canceladas-title" class="column-title column-title-muted">
                        Canceladas <span id="badge-count-canceladas" class="badge-count badge-canceladas">0</span>
                    </h2>
                </div>

                <div id="canceladas-cards-container" class="column-cards">
                    <!-- Inyectado dinámicamente por js/misReservas.js -->
                </div>
            </section>

        </div>

    </main>

    <div id="site-footer"></div>

    <div id="site-mobile-nav"></div>

</body>
</html>
