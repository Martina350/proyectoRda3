<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en Pet CareConnect para gestionar el cuidado de tu mascota.">
    <title> Pet CareConnect - Iniciar Sesión</title>
</head>
<body>

    <main>

        <section aria-labelledby="login-title">
            <h1 id="login-title"><a href="../index.html">Pet CareConnect</a></h1>
            <p>Bienvenido de nuevo. Inicia sesión para cuidar de tu mascota.</p>

            <form action="misReservas.html" method="GET">
                <fieldset>
                    <legend>Datos de acceso</legend>
                    
                    <p>
                        <label for="email">Correo electrónico</label><br>
                        <input type="email" id="email" name="email" placeholder="tu@ejemplo.com" autocomplete="email" required>
                    </p>
                    
                    <p>
                        <label for="password">Contraseña</label><br>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                        <button type="button" aria-controls="password" aria-label="Mostrar u ocultar contraseña">Mostrar</button>
                    </p>
                    
                    <p>
                        <a href="#">¿Olvidaste tu contraseña?</a>
                    </p>
                    
                    <p>
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Mantener sesión iniciada</label>
                    </p>
                    
                    <p>
                        <button type="submit">Entrar</button>
                    </p>
                </fieldset>
            </form>
        </section>

        <section aria-labelledby="register-title">
            <h2 id="register-title">¿No tienes una cuenta?</h2>
            <a href="login.html">Regístrate gratis</a>
        </section>

    </main>

    <footer>
        <p>2026  Pet CareConnect Inc. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
