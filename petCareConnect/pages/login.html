<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en PetCareConnect para gestionar el cuidado de tu mascota.">
    <title>PetCareConnect - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="login-page-body">

    <main class="login-main-container">

        <div class="login-wrapper">
            <section aria-labelledby="login-title" class="login-header-block">
                <div class="login-logo-title-row">
                    <span class="material-symbols-outlined login-logo-icon">pets</span>
                    <h1 id="login-title">PetCareConnect</h1>
                </div>
                <p>Bienvenido de nuevo. Inicia sesión para cuidar de tu mascota.</p>

                <div class="login-card-container">
                    <form action="#" method="POST" id="loginForm">
                        <fieldset class="login-fieldset">
                            <legend class="sr-only">Datos de acceso</legend>
                            
                            <div class="login-form-item">
                                <label for="email">Correo electrónico</label>
                                <div class="input-icon-wrapper">
                                    <span class="material-symbols-outlined input-left-icon">mail</span>
                                    <input type="email" id="email" class="login-input" name="email" placeholder="tu@ejemplo.com" autocomplete="email" required>
                                </div>
                            </div>
                            
                            <div class="login-form-item">
                                <div class="password-label-row">
                                    <label for="password">Contraseña</label>
                                    <a href="#" class="forgot-password-link">¿Olvidaste tu contraseña?</a>
                                </div>
                                <div class="input-icon-wrapper">
                                    <span class="material-symbols-outlined input-left-icon">lock</span>
                                    <input type="password" id="password" class="login-input" name="password" placeholder="••••••••" required>
                                    <button type="button" class="toggle-password-btn" aria-controls="password" aria-label="Mostrar u ocultar contraseña" onclick="togglePassword()">
                                        <span class="material-symbols-outlined" id="passwordIcon">visibility</span>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="remember-checkbox-item">
                                <input type="checkbox" id="remember" name="remember">
                                <label for="remember">Mantener sesión iniciada</label>
                            </div>
                            
                            <button type="submit" class="login-submit-btn">
                                <span>Entrar</span>
                                <span class="material-symbols-outlined">login</span>
                            </button>
                        </fieldset>
                    </form>
                </div>
            </section>

            <section aria-labelledby="register-title" class="register-prompt-section">
                <h2 id="register-title">¿No tienes una cuenta?</h2>
                <a href="#">Regístrate gratis</a>
            </section>
        </div>

    </main>

    <footer class="login-footer">
        <p>© 2026 PetCareConnect Inc. Todos los derechos reservados.</p>
    </footer>

    <script>
        function togglePassword() {
            const passInput = document.getElementById('password');
            const passIcon = document.getElementById('passwordIcon');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                passIcon.innerText = 'visibility_off';
            } else {
                passInput.type = 'password';
                passIcon.innerText = 'visibility';
            }
        }
    </script>
</body>
</html>
